name: Release platform bundles

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional GitHub release tag; defaults to platform-vVERSION-SHORT_SHA
        required: false
        type: string
      publish_quay:
        description: Also mirror versioned runtime and changed workspace images to Quay
        required: true
        default: false
        type: boolean
      rebuild_workspaces:
        description: Force workspace image rebuilds even when unchanged ("all" or space-separated names, e.g. "jupyter-python vscode-kilo")
        required: false
        default: ""
        type: string
      sign_release:
        description: Sign release.json with the configured GPG release key
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

concurrency:
  group: devcloud-platform-release
  cancel-in-progress: false

jobs:
  release_scope:
    name: Resolve release build scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      short_sha: ${{ steps.metadata.outputs.short_sha }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      build_workspace: ${{ steps.scope.outputs.build_workspace }}
      workspace_matrix: ${{ steps.scope.outputs.workspace_matrix }}
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
      REBUILD_WORKSPACES: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_workspaces || '' }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve immutable release metadata
        id: metadata
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Manual releases must be dispatched from main." >&2
            exit 1
          fi

          version="$(python3 -c 'from app import __version__; print(__version__)')"
          short_sha="${GITHUB_SHA:0:12}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            release_tag="${GITHUB_REF_NAME}"
            if [[ "${release_tag}" != "v${version}" ]]; then
              echo "Tag ${release_tag} does not match app version v${version}." >&2
              exit 1
            fi
          else
            release_tag="${INPUT_RELEASE_TAG:-platform-v${version}-${short_sha}}"
          fi

          if [[ ! "${release_tag}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Release tag contains unsupported characters: ${release_tag}" >&2
            exit 1
          fi

          {
            echo "version=${version}"
            echo "short_sha=${short_sha}"
            echo "release_tag=${release_tag}"
          } >> "${GITHUB_OUTPUT}"
          echo "RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"
          echo "DEVCLOUD_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "SHORT_SHA=${short_sha}" >> "${GITHUB_ENV}"

      # Workspace images have their own lifecycle and are not part of the
      # platform bundles. Build one only when its build context changed since
      # the last published version release, or when explicitly forced.
      - name: Detect changed workspace image contexts
        id: scope
        shell: bash
        run: |
          set -Eeuo pipefail
          all_images=(vscode-kilo vscode-cuda jupyter-python terminal-rocky)

          forced=" "
          read -r -a requested <<< "${REBUILD_WORKSPACES//,/ }"
          for name in "${requested[@]}"; do
            if [[ "${name}" == "all" ]]; then
              forced=" ${all_images[*]} "
              break
            fi
            if [[ " ${all_images[*]} " != *" ${name} "* ]]; then
              echo "Unknown workspace image in rebuild_workspaces: ${name}" >&2
              exit 1
            fi
            forced+="${name} "
          done

          tag_base="${GITHUB_SHA}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]] && git rev-parse --verify "${GITHUB_SHA}^" >/dev/null 2>&1; then
            tag_base="${GITHUB_SHA}^"
          fi
          mapfile -t previous_tags < <(
            git tag --merged "${tag_base}" --sort=-version:refname --list 'v*.*.*'
          )

          # Compare against the newest version whose release was actually
          # published, so a tag whose release failed never hides a change.
          base_tag=""
          for tag in "${previous_tags[@]}"; do
            [[ "${tag}" != "${RELEASE_TAG}" ]] || continue
            is_draft="$(gh release view "${tag}" --json isDraft --jq .isDraft 2>/dev/null || true)"
            if [[ "${is_draft}" == "false" ]]; then
              base_tag="${tag}"
              break
            fi
          done
          echo "Comparing workspace build contexts against ${base_tag:-<no published release>}."

          workspace_images=()
          for image in "${all_images[@]}"; do
            if [[ "${forced}" == *" ${image} "* ]] || [[ -z "${base_tag}" ]] || \
              ! git diff --quiet "${base_tag}" "${GITHUB_SHA}" -- "containers/${image}"; then
              workspace_images+=("${image}")
            fi
          done

          matrix_json="$(printf '%s\n' "${workspace_images[@]}" | python3 -c 'import json, sys; print(json.dumps([line.strip() for line in sys.stdin if line.strip()]))')"
          echo "workspace_matrix=${matrix_json}" >> "${GITHUB_OUTPUT}"
          if ((${#workspace_images[@]})); then
            echo "build_workspace=true" >> "${GITHUB_OUTPUT}"
            echo "Workspace images selected: ${workspace_images[*]}"
          else
            echo "build_workspace=false" >> "${GITHUB_OUTPUT}"
            echo "No workspace image build contexts changed; releasing controller and worker only."
          fi

      # Build jobs upload straight to this draft, so no multi-GB artifacts are
      # staged between jobs. It becomes public only in the publish job.
      - name: Create draft GitHub Release
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; its assets will be replaced."
          else
            gh release create "${RELEASE_TAG}" --draft --target "${GITHUB_SHA}" --title "AI Factory ${DEVCLOUD_VERSION} (${SHORT_SHA})" --generate-notes
          fi

  workspace_images:
    name: Build and publish ${{ matrix.image }} workspace
    needs: release_scope
    if: needs.release_scope.outputs.build_workspace == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: release
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.release_scope.outputs.workspace_matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      DEVCLOUD_VERSION: ${{ needs.release_scope.outputs.version }}
      SHORT_SHA: ${{ needs.release_scope.outputs.short_sha }}
      RELEASE_TAG: ${{ needs.release_scope.outputs.release_tag }}
      IMAGE_REGISTRY: ghcr.io
      IMAGE_REPOSITORY: ${{ github.repository }}
      IMAGE_USERNAME: ${{ github.actor }}
      IMAGE_PASSWORD: ${{ github.token }}
      QUAY_REGISTRY: quay.io
      QUAY_REPOSITORY: aaslangoren/devcloud
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      PUBLISH_QUAY: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_quay) }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      # The CUDA image unpacks ~7 GB of toolkit libraries; reclaim the hosted
      # runner's preinstalled SDKs first so the build and docker save fit.
      - name: Free runner disk for the CUDA image
        if: matrix.image == 'vscode-cuda'
        shell: bash
        run: |
          set -Eeuo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          docker system prune --all --force >/dev/null
          df -h /

      - name: Build workspace image
        shell: bash
        run: |
          set -Eeuo pipefail
          image="${{ matrix.image }}"
          local_image="localhost/devcloud-${image}:${DEVCLOUD_VERSION}"
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --file "containers/${image}/Containerfile" \
            --tag "${local_image}" \
            "containers/${image}"

      - name: Smoke test Kilo Code in the browser extension host
        if: startsWith(matrix.image, 'vscode-')
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --prefix "${RUNNER_TEMP}/vscode-smoke" playwright@1.58.2
          "${RUNNER_TEMP}/vscode-smoke/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="${RUNNER_TEMP}/vscode-smoke/node_modules" \
            node deploy/ci/smoke-vscode.cjs "localhost/devcloud-${{ matrix.image }}:${DEVCLOUD_VERSION}"

      - name: Save failed Kilo Code browser check
        if: failure() && startsWith(matrix.image, 'vscode-')
        uses: actions/upload-artifact@v4
        with:
          name: kilo-code-smoke-${{ matrix.image }}
          path: ${{ runner.temp }}/kilo-code-smoke.png
          if-no-files-found: ignore
          retention-days: 1

      - name: Push immutable workspace image tags
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${IMAGE_USERNAME:-}" && -n "${IMAGE_PASSWORD:-}" ]] || {
            echo "GHCR publishing requires IMAGE_USERNAME and IMAGE_PASSWORD." >&2
            exit 1
          }
          printf '%s' "${IMAGE_PASSWORD}" |
            docker login --username "${IMAGE_USERNAME}" --password-stdin "${IMAGE_REGISTRY}"
          quay_logged_in=false
          cleanup() {
            docker logout "${IMAGE_REGISTRY}" >/dev/null 2>&1 || true
            if [[ "${quay_logged_in}" == "true" ]]; then
              docker logout "${QUAY_REGISTRY}" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          image="${{ matrix.image }}"
          local_image="localhost/devcloud-${image}:${DEVCLOUD_VERSION}"
          repositories=("${IMAGE_REGISTRY}/${IMAGE_REPOSITORY}")

          if [[ "${PUBLISH_QUAY}" == "true" ]]; then
            [[ -n "${QUAY_USERNAME:-}" && -n "${QUAY_PASSWORD:-}" ]] || {
              echo "Quay mirroring requires QUAY_USERNAME and QUAY_PASSWORD." >&2
              exit 1
            }
            printf '%s' "${QUAY_PASSWORD}" |
              docker login --username "${QUAY_USERNAME}" --password-stdin "${QUAY_REGISTRY}"
            quay_logged_in=true
            repositories+=("${QUAY_REGISTRY}/${QUAY_REPOSITORY}")
          fi

          for repository in "${repositories[@]}"; do
            for remote_tag in \
              "${image}-${DEVCLOUD_VERSION}" \
              "${image}-${DEVCLOUD_VERSION}-${SHORT_SHA}"; do
              remote_image="${repository}:${remote_tag}"
              docker tag "${local_image}" "${remote_image}"
              docker push "${remote_image}"
            done
          done

      # vscode-cuda is registry-only: its archive exceeds the 2 GiB asset limit.
      - name: Attach offline workspace archive
        if: matrix.image == 'vscode-kilo' || matrix.image == 'jupyter-python'
        shell: bash
        run: |
          set -Eeuo pipefail
          image="${{ matrix.image }}"
          local_image="localhost/devcloud-${image}:${DEVCLOUD_VERSION}"
          archive="${RUNNER_TEMP}/devcloud-workspace-${image}-v${DEVCLOUD_VERSION}-${SHORT_SHA}.tar.gz"
          # pigz writes standard gzip using every runner core.
          if ! command -v pigz >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq pigz
          fi
          docker save "${local_image}" | pigz -6 > "${archive}"
          archive_size="$(stat --format=%s "${archive}")"
          if (( archive_size >= 2147483648 )); then
            echo "Workspace archive exceeds GitHub's 2 GiB release-asset limit." >&2
            exit 1
          fi
          (
            cd "$(dirname "${archive}")"
            sha256sum "$(basename "${archive}")" > "$(basename "${archive}").sha256"
          )
          gh release upload "${RELEASE_TAG}" --clobber "${archive}" "${archive}.sha256"

  # Runs in parallel with the workspace image jobs; only publication waits for
  # both sides.
  platform:
    name: Build and publish Rocky 10 platform
    needs: release_scope
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      DEVCLOUD_VERSION: ${{ needs.release_scope.outputs.version }}
      SHORT_SHA: ${{ needs.release_scope.outputs.short_sha }}
      RELEASE_TAG: ${{ needs.release_scope.outputs.release_tag }}
      IMAGE_REGISTRY: ghcr.io
      IMAGE_REPOSITORY: ${{ github.repository }}
      IMAGE_USERNAME: ${{ github.actor }}
      IMAGE_PASSWORD: ${{ github.token }}
      QUAY_REGISTRY: quay.io
      QUAY_REPOSITORY: aaslangoren/devcloud
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      RELEASE_GPG_KEY_ID: ${{ secrets.RELEASE_GPG_KEY_ID }}
      PUBLISH_QUAY: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_quay) }}
      # Signing stays opt-in while existing hosts transition to trusted keyrings.
      SIGN_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release asset directory
        shell: bash
        run: |
          set -Eeuo pipefail
          asset_dir="${RUNNER_TEMP}/devcloud-release-assets"
          rm -rf -- "${asset_dir}"
          install -d -m 0755 "${asset_dir}"
          platform_filename="devcloud-platform-update-v${DEVCLOUD_VERSION}-${SHORT_SHA}.tar.gz"
          {
            echo "ASSET_DIR=${asset_dir}"
            echo "PLATFORM_FILENAME=${platform_filename}"
            echo "ASSET_BASE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          } >> "${GITHUB_ENV}"

      - name: Check hosted runner capacity
        shell: bash
        run: |
          set -Eeuo pipefail
          docker info >/dev/null
          available_kib="$(df --output=avail -k "${RUNNER_TEMP}" | tail -n 1 | tr -d ' ')"
          if (( available_kib < 8388608 )); then
            echo "At least 8 GiB of free runner storage is required; found $((available_kib / 1024 / 1024)) GiB." >&2
            exit 1
          fi
          df -h "${RUNNER_TEMP}"

      - name: Build and verify in Rocky Linux 10
        shell: bash
        run: |
          set -Eeuo pipefail
          # Host-disk image store so Podman can use native overlay instead of
          # vfs inside the container (overlay cannot sit on Docker's overlay).
          storage_dir="${RUNNER_TEMP}/devcloud-containers-storage"
          install -d -m 0700 "${storage_dir}"
          docker run --privileged --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume "${ASSET_DIR}:/release-assets" \
            --volume "${storage_dir}:/var/lib/containers" \
            --env GITHUB_SHA \
            --env DEVCLOUD_VERSION \
            --env SHORT_SHA \
            --env PLATFORM_FILENAME \
            --env ASSET_BASE_URL \
            --env IMAGE_REGISTRY \
            --env IMAGE_REPOSITORY \
            --env IMAGE_USERNAME \
            --env IMAGE_PASSWORD \
            --env QUAY_REGISTRY \
            --env QUAY_REPOSITORY \
            --env QUAY_USERNAME \
            --env QUAY_PASSWORD \
            --env PUBLISH_QUAY \
            --env SIGN_RELEASE \
            --env RELEASE_GPG_PRIVATE_KEY \
            --env RELEASE_GPG_KEY_ID \
            rockylinux/rockylinux:10.2 \
            bash /workspace/deploy/ci/build-release-assets.sh

      - name: Attach platform assets to the draft release
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -d '' release_assets < <(
            find "${ASSET_DIR}" -maxdepth 1 -type f -print0 | sort -z
          )
          [[ "${#release_assets[@]}" -gt 0 ]] || {
            echo "No release assets were generated." >&2
            exit 1
          }
          [[ -f "${ASSET_DIR}/devcloud-update-channel.json" ]] || {
            echo "Release channel descriptor is missing." >&2
            exit 1
          }
          gh release upload "${RELEASE_TAG}" --clobber "${release_assets[@]}"

      # Only this small file is staged between jobs; publish commits it to
      # the stable branch.
      - name: Stage release channel descriptor
        uses: actions/upload-artifact@v4
        with:
          name: devcloud-update-channel
          path: ${{ runner.temp }}/devcloud-release-assets/devcloud-update-channel.json
          if-no-files-found: error
          retention-days: 1

  # The only automated test gate (there is no PR/merge CI). It runs in parallel
  # with the builds, so it adds no time, and publish requires it.
  tests:
    name: Run test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: devcloud_test
          POSTGRES_USER: devcloud
          POSTGRES_PASSWORD: devcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devcloud -d devcloud_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://devcloud:devcloud@127.0.0.1:5432/devcloud_test
      TEST_POSTGRESQL_URL: postgresql+asyncpg://devcloud:devcloud@127.0.0.1:5432/devcloud_test
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q

  publish:
    name: Publish GitHub Release
    needs: [release_scope, workspace_images, platform, tests]
    if: >-
      always() &&
      needs.release_scope.result == 'success' &&
      needs.platform.result == 'success' &&
      needs.tests.result == 'success' &&
      (needs.workspace_images.result == 'success' || needs.workspace_images.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      DEVCLOUD_VERSION: ${{ needs.release_scope.outputs.version }}
      SHORT_SHA: ${{ needs.release_scope.outputs.short_sha }}
      RELEASE_TAG: ${{ needs.release_scope.outputs.release_tag }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Collect release channel descriptor
        uses: actions/download-artifact@v4
        with:
          name: devcloud-update-channel
          path: ${{ runner.temp }}/devcloud-channel

      - name: Publish the draft GitHub Release
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release view "${RELEASE_TAG}" --json assets --jq '.assets[] | "\(.name) \(.size)"'
          gh release edit "${RELEASE_TAG}" --draft=false

      - name: Advance stable Git update channel
        shell: bash
        run: |
          set -Eeuo pipefail
          channel_copy="${RUNNER_TEMP}/devcloud-update-channel.json"
          cp "${RUNNER_TEMP}/devcloud-channel/devcloud-update-channel.json" "${channel_copy}"

          git config user.name github-actions
          git config user.email github-actions@github.com

          if git ls-remote --exit-code --heads origin stable >/dev/null 2>&1; then
            git fetch --depth=1 origin stable
            git switch --force-create stable FETCH_HEAD
          else
            git switch --orphan stable
          fi

          git rm -r --ignore-unmatch .
          cp "${channel_copy}" devcloud-update-channel.json
          git add devcloud-update-channel.json

          if git diff --cached --quiet; then
            echo "Stable channel already references this release."
            exit 0
          fi

          git commit -m "release: point stable to ${DEVCLOUD_VERSION}-${SHORT_SHA}"
          git push origin HEAD:stable
